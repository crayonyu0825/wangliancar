[app]
# Official SimOne installation supplied with the competition environment.
sdk_dir = E:\Sim-One\SimOneAPI\lib\Win64
python_exe = E:\Sim-One\Tools\python36\python.exe
server_ip = 127.0.0.1
vehicle_id = 0
sensor_id = perfectPerception1
# Optional verified, task-scoped Sensor visibility model; blank means unknown.
sensor_visibility_file =
# Optional captain-verified task/model file. Blank enables no new maneuvers.
# See BEHAVIOR_INPUTS.md and behavior_model.example.json; the template stays disabled.
behavior_model_file =
# Optional local OpenDRIVE file; it must match the SDK-selected map MD5.
# Blank: try the installed map cache, then the SDK-supplied document URL.
map_document_file =

# Captain perception loop.
loop_hz = 20
# Host-monotonic stalled-frame timeout; frame gap is not milliseconds.
sensor_timeout_ms = 500
max_sensor_frame_gap = 10
pipeline_timeout_ms = 200
connect_timeout_sec = 30
map_timeout_sec = 100
scene_id_override = 0

# Record official judge/GPS data using the bundled SDK's local evaluation mode.
# Save during the run as well as before SDK termination.
evaluation_enabled = true
evaluation_flush_interval_sec = 1.0

# Safe default: compute a trial control candidate but never send it.
send_control = false
# Legacy flag name: means the control mapping is configured, not field-verified.
# SimOne-Car preset: wheelbase 291.87 cm. Remaining values are conservative
# engineering trial settings for offline output; validate on the running car.
control_calibrated = true
control_wheelbase_m = 2.9187
control_front_steer_max_rad = 0.5
# The bundled SimOne Autopilot sample uses negative steering for a left path.
control_steering_sign = -1
control_throttle_per_mps = 0.1
control_brake_per_mps = 0.2
control_hold_brake = 0.1
control_emergency_brake = 0.8
control_max_throttle = 0.25
control_max_brake = 0.35
# Normal sending also requires an armed safety exit; its brake values need calibration.
safety_brake_enabled = false
safety_controlled_brake = 0.3
safety_emergency_brake = 1.0
safety_recovery_frames = 3
publish_json = true
log_level = INFO
